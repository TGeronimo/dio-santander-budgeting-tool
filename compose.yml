services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: transaction
      MARIADB_USER: app
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no .env do servidor}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env do servidor}
    volumes:
      - transaction_data_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/transaction
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no .env do servidor}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Configure OPENAI_API_KEY no .env do servidor}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env do servidor}
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI: INFO
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MariaDBDialect

volumes:
  transaction_data_mariadb: